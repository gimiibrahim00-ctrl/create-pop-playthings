name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Test and build
        run: gradle clean test build --warning-mode all --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: create-pop-playthings-build
          path: |
            build/libs/*.jar
            build/reports/**
            build/test-results/**
          if-no-files-found: warn
